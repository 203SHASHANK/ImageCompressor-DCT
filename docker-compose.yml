services:
  app:
    build: .
    container_name: imagecompressor-dct
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
